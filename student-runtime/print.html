<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print tracking sheet</title><style>body{margin:0;background:#edf0e9;font:14px system-ui;text-align:center;color:#183c35}header{padding:20px}button,a{display:inline-block;padding:10px 20px;background:#183c35;color:white;border:0;border-radius:6px;cursor:pointer;text-decoration:none;margin:4px}img{display:block;width:min(95vw,720px);height:auto;margin:0 auto 25px}#error{padding:30px}@page{size:A4 portrait;margin:10mm}@media print{body{background:white}header,#error{display:none}img{width:190mm;height:253.333mm;margin:0;object-fit:contain}}</style><style id="pageOrientation"></style></head><body><header><h2>Project tracking sheet</h2><p>Print the whole sheet without cropping. Keep it flat and evenly lit.</p><button id="print" disabled>Print / Save PDF</button><a id="download" hidden download="AR-tracking-sheet.png">Download PNG</a></header><img id="sheet" alt="Project tracking sheet" hidden><p id="error"></p><script type="module">import{api,asset}from'./common.js';const id=new URLSearchParams(location.search).get('id'),sheet=document.querySelector('#sheet'),button=document.querySelector('#print');button.onclick=()=>window.print();try{await api('projects/'+id);sheet.onload=()=>{sheet.hidden=false;button.disabled=false;const landscape=sheet.naturalWidth>sheet.naturalHeight;if(landscape)document.querySelector('#pageOrientation').textContent='@page{size:A4 landscape;margin:10mm}@media print{img{width:253.333mm;height:190mm}}';document.querySelector('#download').hidden=false;};sheet.onerror=()=>document.querySelector('#error').textContent='Generate the tracking sheet in the dashboard first.';sheet.src=asset(id,'sheet');document.querySelector('#download').href=sheet.src;}catch(e){document.querySelector('#error').textContent=e.message;}</script></body></html>
